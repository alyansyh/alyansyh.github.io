      <stop offset="0%" stop-color="#09141f"/>
      <stop offset="100%" stop-color="#0f2b3c"/>
    </linearGradient>
    <linearGradient id="cardFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgFin)"/>
  <circle cx="200" cy="100" r="150" fill="#10b981" opacity="0.12" filter="blur(60px)"/>
