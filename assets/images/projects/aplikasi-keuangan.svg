  <text x="325" y="298" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ef4444">-Rp 38.000</text>

  <rect x="145" y="318" width="190" height="38" rx="8" fill="#0e1f33"/>
