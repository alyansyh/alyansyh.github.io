  <rect x="410" y="172" width="310" height="10" rx="5" fill="#13273d"/>
  <rect x="410" y="172" width="108" height="10" rx="5" fill="#10b981"/>

  <!-- Progress bar 2 -->
  <text x="410" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">Belanja &amp; Kebutuhan</text>
  <text x="715" y="215" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#06b6d4">Rp 1.890.000 (27%)</text>
  <rect x="410" y="227" width="310" height="10" rx="5" fill="#13273d"/>
  <rect x="410" y="227" width="84" height="10" rx="5" fill="#06b6d4"/>

