  <text x="715" y="270" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">Rp 1.250.000 (18%)</text>
  <rect x="410" y="282" width="310" height="10" rx="5" fill="#13273d"/>
  <rect x="410" y="282" width="56" height="10" rx="5" fill="#f59e0b"/>

  <rect x="410" y="325" width="310" height="42" rx="8" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="425" y="350" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">✨ Anda menghemat 20% lebih banyak dari bulan lalu!</text>
