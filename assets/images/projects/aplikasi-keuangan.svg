  <!-- Phone Frame Left -->
  <rect x="130" y="35" width="220" height="380" rx="32" fill="#08101a" stroke="#1e3a5f" stroke-width="3"/>
  <rect x="195" y="45" width="90" height="14" rx="7" fill="#1e3a5f"/>
  
  <!-- Inside Phone 1 -->
  <rect x="145" y="75" width="190" height="105" rx="14" fill="url(#cardFin)"/>
