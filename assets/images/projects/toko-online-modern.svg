<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgToko" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgToko)"/>
  
  <!-- Glow orbs -->
  <circle cx="120" cy="80" r="140" fill="#06b6d4" opacity="0.12" filter="blur(40px)"/>
  <circle cx="700" cy="380" r="160" fill="#6366f1" opacity="0.15" filter="blur(50px)"/>
  
  <!-- Browser Window Frame -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="38" rx="12" fill="#1e293b"/>
  <circle cx="65" cy="49" r="6" fill="#ef4444"/>
  <circle cx="85" cy="49" r="6" fill="#f59e0b"/>
  <circle cx="105" cy="49" r="6" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="140" y="40" width="360" height="18" rx="6" fill="#0f172a"/>
  <text x="160" y="53" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">https://store.gadget-hub.id/catalog</text>
  
  <!-- Navbar inside mockup -->
  <rect x="40" y="68" width="720" height="42" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="94" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">GADGET<tspan fill="#f8fafc">HUB</tspan></text>
  <rect x="230" y="80" width="180" height="18" rx="9" fill="#1e293b"/>
  <text x="245" y="93" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Cari smartphone, laptop...</text>
  <circle cx="680" cy="89" r="12" fill="#1e293b"/>
  <text x="676" y="93" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">🛒</text>
  <circle cx="688" cy="81" r="5" fill="#ef4444"/>
  <text x="686" y="84" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#fff">3</text>

  <!-- Hero Promo Banner inside mockup -->
  <rect x="70" y="125" width="660" height="95" rx="10" fill="url(#accentCyan)"/>
  <text x="100" y="160" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">PROMO SPESIAL GAWAI 2025</text>
  <text x="100" y="185" font-family="system-ui, sans-serif" font-size="12" fill="#e0f2fe">Diskon hingga 40% untuk flagship smartphone &amp; aksesoris</text>
  <rect x="580" y="152" width="120" height="32" rx="16" fill="#ffffff"/>
  <text x="610" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">Beli Sekarang</text>

  <!-- Product Cards Grid -->
  <!-- Product 1 -->
  <rect x="70" y="235" width="205" height="165" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <rect x="85" y="248" width="175" height="75" rx="6" fill="#0284c7" opacity="0.2"/>
  <text x="172" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28">📱</text>
  <text x="85" y="342" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">NovaPhone Pro 16</text>
  <text x="85" y="360" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Rp 12.499.000</text>
  <rect x="85" y="372" width="175" height="20" rx="4" fill="#0284c7"/>
  <text x="172" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">+ Keranjang</text>

  <!-- Product 2 -->
  <rect x="297" y="235" width="205" height="165" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <rect x="312" y="248" width="175" height="75" rx="6" fill="#8b5cf6" opacity="0.2"/>
  <text x="400" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28">💻</text>
  <text x="312" y="342" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">UltraBook M4 14"</text>
  <text x="312" y="360" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Rp 18.999.000</text>
  <rect x="312" y="372" width="175" height="20" rx="4" fill="#8b5cf6"/>
  <text x="400" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">+ Keranjang</text>

  <!-- Product 3 -->
  <rect x="525" y="235" width="205" height="165" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <rect x="540" y="248" width="175" height="75" rx="6" fill="#10b981" opacity="0.2"/>
  <text x="627" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28">🎧</text>
  <text x="540" y="342" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Acoustic Pro ANC</text>
  <text x="540" y="360" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Rp 2.199.000</text>
  <rect x="540" y="372" width="175" height="20" rx="4" fill="#10b981"/>
  <text x="627" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">+ Keranjang</text>
</svg>
