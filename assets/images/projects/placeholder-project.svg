<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Outer Card Frame -->
  <rect x="150" y="75" width="500" height="300" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Icon Placeholder -->
  <circle cx="400" cy="190" r="48" fill="url(#accentGrad)" opacity="0.2"/>
  <circle cx="400" cy="190" r="36" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M386 198 L396 182 L406 194 L414 186 L422 198 Z" fill="none" stroke="#a855f7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="390" cy="176" r="4" fill="#6366f1"/>

  <text x="400" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Gambar Proyek Belum Ada
  </text>
  <text x="400" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    Simpan file gambar di assets/images/projects/
  </text>
</svg>
