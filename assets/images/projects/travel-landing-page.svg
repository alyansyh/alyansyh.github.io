<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c192c"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgSky)"/>

  <!-- Sun -->
  <circle cx="580" cy="180" r="90" fill="url(#sunsetGrad)" opacity="0.8"/>

  <!-- Mountain Silhouettes -->
  <polygon points="50,340 260,160 470,340" fill="#1e293b" opacity="0.6"/>
  <polygon points="320,360 520,200 720,360" fill="#1e293b" opacity="0.8"/>
  <polygon points="150,380 380,220 610,380" fill="url(#mountainGrad)"/>
  <rect x="0" y="340" width="800" height="110" fill="#090d16"/>

  <!-- Sea reflection -->
  <ellipse cx="580" cy="355" rx="140" ry="15" fill="#f97316" opacity="0.25"/>

  <!-- UI Overlay: Navbar & Hero Search -->
  <rect x="40" y="24" width="720" height="44" rx="22" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="70" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#f8fafc">JELAJAH<tspan fill="#f97316">NESIA</tspan></text>
  <text x="440" y="51" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Destinasi</text>
  <text x="520" y="51" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Paket Wisata</text>
  <text x="620" y="51" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Artikel</text>
  <rect x="680" y="31" width="65" height="30" rx="15" fill="#f97316"/>
  <text x="712" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff">Daftar</text>

  <!-- Hero Content -->
  <text x="70" y="140" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff">Temukan Keajaiban Tersembunyi</text>
  <text x="70" y="172" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#f97316">Nusantara Indonesia</text>
  <text x="70" y="205" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Jelajahi lebih dari 500 destinasi pulau eksotis, keindahan alam, dan budaya lokal.</text>

  <!-- Search Card Box -->
  <rect x="70" y="235" width="460" height="60" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="95" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">LOKASI IMPIAN</text>
  <text x="95" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Raja Ampat, Papua</text>
  <line x1="250" y1="247" x2="250" y2="285" stroke="#334155" stroke-width="1"/>
  <text x="270" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">TANGGAL BERANGKAT</text>
  <text x="270" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">15 Nov - 20 Nov</text>
  <rect x="420" y="244" width="96" height="42" rx="10" fill="url(#sunsetGrad)"/>
  <text x="468" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Cari Tur</text>

  <!-- Floating Destination Pill -->
  <rect x="70" y="380" width="160" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="85" y="405" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">🏝️ Labuan Bajo</text>
  <text x="210" y="405" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#f97316">★ 4.9</text>

  <rect x="245" y="380" width="160" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="260" y="405" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">🌋 Gunung Bromo</text>
  <text x="385" y="405" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#f97316">★ 4.8</text>

  <rect x="420" y="380" width="160" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="435" y="405" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">⛩️ Ubud, Bali</text>
  <text x="560" y="405" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#f97316">★ 5.0</text>
</svg>
