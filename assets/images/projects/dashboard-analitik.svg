<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgDash)"/>

  <!-- Glows -->
  <circle cx="300" cy="150" r="180" fill="#6366f1" opacity="0.1" filter="blur(60px)"/>
  <circle cx="650" cy="280" r="150" fill="#38bdf8" opacity="0.1" filter="blur(50px)"/>

  <!-- Browser Container -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#0b1324" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="36" rx="12" fill="#151f33"/>
  <circle cx="62" cy="48" r="5" fill="#ef4444"/>
  <circle cx="78" cy="48" r="5" fill="#f59e0b"/>
  <circle cx="94" cy="48" r="5" fill="#10b981"/>
  <text x="120" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Nexus Analytics Console v2.4</text>

  <!-- Sidebar -->
  <rect x="40" y="66" width="130" height="354" fill="#0d1627" stroke="#1e293b" stroke-width="1"/>
  <rect x="52" y="86" width="106" height="26" rx="6" fill="#1e293b"/>
  <text x="64" y="103" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">📊 Dashboard</text>
  <text x="64" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">👥 Pengguna</text>
  <text x="64" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">💰 Pendapatan</text>
  <text x="64" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">⚙️ Pengaturan</text>

  <!-- Metric Card 1 -->
  <rect x="188" y="82" width="170" height="74" rx="8" fill="#131e33" stroke="#1e293b" stroke-width="1"/>
  <text x="202" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Total Omset Bulan Ini</text>
  <text x="202" y="126" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Rp 482.5M</text>
  <text x="202" y="145" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#10b981">↑ +24.8% vs bln lalu</text>

  <!-- Metric Card 2 -->
  <rect x="372" y="82" width="170" height="74" rx="8" fill="#131e33" stroke="#1e293b" stroke-width="1"/>
  <text x="386" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Pengunjung Aktif</text>
  <text x="386" y="126" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">84,210</text>
  <text x="386" y="145" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#38bdf8">↑ +12.3% pengunjung</text>

  <!-- Metric Card 3 -->
  <rect x="556" y="82" width="170" height="74" rx="8" fill="#131e33" stroke="#1e293b" stroke-width="1"/>
  <text x="570" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Tingkat Konversi</text>
  <text x="570" y="126" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">4.82%</text>
  <text x="570" y="145" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#10b981">↑ +1.1% stabil</text>

  <!-- Big Chart: Line chart -->
  <rect x="188" y="170" width="354" height="230" rx="8" fill="#131e33" stroke="#1e293b" stroke-width="1"/>
  <text x="204" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Tren Pertumbuhan Pengguna</text>
  <!-- Chart area & lines -->
  <path d="M 210 350 Q 260 300, 310 320 T 410 240 T 510 210" fill="none" stroke="#6366f1" stroke-width="3"/>
  <path d="M 210 350 Q 260 300, 310 320 T 410 240 T 510 210 L 510 370 L 210 370 Z" fill="url(#purpleGrad)"/>
  <!-- Chart dots -->
  <circle cx="310" cy="320" r="4" fill="#8b5cf6"/>
  <circle cx="410" cy="240" r="4" fill="#a855f7"/>
  <circle cx="510" cy="210" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

  <!-- Bar Chart Widget -->
  <rect x="556" y="170" width="170" height="230" rx="8" fill="#131e33" stroke="#1e293b" stroke-width="1"/>
  <text x="570" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Penjualan per Region</text>
  <rect x="576" y="320" width="18" height="50" rx="3" fill="url(#barGrad)"/>
  <rect x="604" y="270" width="18" height="100" rx="3" fill="url(#barGrad)"/>
  <rect x="632" y="240" width="18" height="130" rx="3" fill="#8b5cf6"/>
  <rect x="660" y="290" width="18" height="80" rx="3" fill="url(#barGrad)"/>
  <rect x="688" y="220" width="18" height="150" rx="3" fill="#10b981"/>
  <text x="578" y="385" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">JKT</text>
  <text x="606" y="385" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">BDG</text>
  <text x="634" y="385" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">SBY</text>
  <text x="662" y="385" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">MDN</text>
  <text x="690" y="385" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">DPS</text>
</svg>
