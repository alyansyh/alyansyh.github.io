  <rect width="800" height="550" fill="url(#bgKM)"/>

  <!-- Border -->
  <rect x="35" y="35" width="730" height="480" rx="12" fill="#091310" stroke="#1b4d3e" stroke-width="2"/>
  <rect x="47" y="47" width="706" height="456" rx="8" fill="none" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Header Emblem -->
  <circle cx="400" cy="95" r="30" fill="url(#emeraldGrad)"/>
  <text x="400" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22">🇮🇩</text>

  <text x="400" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="3" fill="#ffffff">KAMPUS MERDEKA</text>
