  <text x="400" y="260" text-anchor="middle" font-family="system-ui, Georgia, serif" font-size="30" font-weight="bold" fill="#ffffff">Alyan Pratama</text>
  <line x1="260" y1="275" x2="540" y2="275" stroke="#10b981" stroke-width="2"/>

