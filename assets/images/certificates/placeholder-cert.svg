<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#certBg)"/>
  
  <!-- Certificate Border -->
  <rect x="40" y="40" width="720" height="470" rx="12" fill="#0b1120" stroke="#334155" stroke-width="2"/>
  <rect x="52" y="52" width="696" height="446" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="8 6"/>

  <!-- PDF Icon Centered -->
  <rect x="340" y="140" width="120" height="150" rx="14" fill="#ef4444" opacity="0.15"/>
  <rect x="340" y="140" width="120" height="150" rx="14" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <path d="M 420 140 L 460 180 L 420 180 Z" fill="#ef4444" opacity="0.3"/>
  <text x="400" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ef4444">PDF</text>

  <!-- Seal -->
  <circle cx="400" cy="340" r="38" fill="url(#goldSeal)" opacity="0.9"/>
  <circle cx="400" cy="340" r="30" fill="none" stroke="#fef3c7" stroke-width="2"/>
  <text x="400" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22">🎖️</text>

  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Preview Sertifikat Dokumen PDF
  </text>
  <text x="400" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">
    Klik "Lihat Sertifikat" untuk membaca atau mengunduh dokumen resmi
  </text>
</svg>
